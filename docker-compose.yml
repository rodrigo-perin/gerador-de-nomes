version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile-app
    ports:
      - "80:80"
    environment:
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - SQS_QUEUE_URL=${SQS_QUEUE_URL}
      - DYNAMODB_TABLE_NAME=${DYNAMODB_TABLE_NAME}
